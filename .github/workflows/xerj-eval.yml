name: XERJ evaluation (temporary)

on:
  push:
    branches:
      - test/xerj-eval-20261003

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout VeriPatch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install checksum-verified XERJ
        shell: bash
        run: |
          set -euo pipefail
          VER="1.0.0-rc.80"
          ASSET="xerj-${VER}-x86_64-unknown-linux-musl.tar.gz"
          BASE="https://github.com/xerj-org/xerj/releases/download/v${VER}"

          curl -fsSLO "${BASE}/${ASSET}"
          curl -fsSLO "${BASE}/${ASSET}.sha256"
          sha256sum -c "${ASSET}.sha256"

          tar xzf "${ASSET}"
          XERJ_BIN="$(find . -maxdepth 2 -type f -name xerj | head -n 1)"
          test -n "${XERJ_BIN}"
          chmod +x "${XERJ_BIN}"
          cp "${XERJ_BIN}" /tmp/xerj
          /tmp/xerj --version

      - name: Start local XERJ node
        shell: bash
        run: |
          set -euo pipefail
          /tmp/xerj --insecure --data-dir /tmp/xerj-data > /tmp/xerj-server.log 2>&1 &
          echo $! > /tmp/xerj.pid

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:9200/ >/dev/null; then
              echo "XERJ is ready"
              exit 0
            fi
            sleep 1
          done

          cat /tmp/xerj-server.log
          exit 1

      - name: Dry-run and index VeriPatch
        shell: bash
        run: |
          set -euo pipefail
          echo "=== AUTOINDEX DRY RUN ==="
          /tmp/xerj autoindex . \
            --url http://127.0.0.1:9200 \
            --prefix veripatch \
            --state-dir /tmp/xerj-state \
            --progress plain \
            --disable-feedback \
            --dry-run || dry_code=$?

          dry_code="${dry_code:-0}"
          if [[ "${dry_code}" != "0" && "${dry_code}" != "3" ]]; then
            echo "dry-run failed with exit ${dry_code}"
            exit "${dry_code}"
          fi

          start_ns=$(date +%s%N)
          set +e
          /tmp/xerj autoindex . \
            --url http://127.0.0.1:9200 \
            --prefix veripatch \
            --state-dir /tmp/xerj-state \
            --progress plain \
            --disable-feedback
          index_code=$?
          set -e
          end_ns=$(date +%s%N)

          if [[ "${index_code}" != "0" && "${index_code}" != "3" ]]; then
            echo "index failed with exit ${index_code}"
            cat /tmp/xerj-server.log
            exit "${index_code}"
          fi

          echo "XERJ_INDEX_WALL_MS=$(( (end_ns - start_ns) / 1000000 ))"
          echo "=== DATA MAP ==="
          /tmp/xerj autoindex map --url http://127.0.0.1:9200 --disable-feedback

      - name: Compare XERJ retrieval with plain grep
        shell: bash
        run: |
          set -euo pipefail

          queries=(
            "sandbox verification docker"
            "OSV vulnerability scan"
            "confidence verdict report"
          )

          for q in "${queries[@]}"; do
            echo
            echo "============================================================"
            echo "QUESTION TERMS: ${q}"
            echo "============================================================"

            payload=$(jq -nc --arg q "${q}" '{
              size: 5,
              query: {
                multi_match: {
                  query: $q,
                  fields: ["defs^3", "body", "title"]
                }
              },
              _source: ["ax_path", "language", "title", "defs", "symbols"],
              track_total_hits: true
            }')

            start_ns=$(date +%s%N)
            response=$(curl -fsS -XPOST 'http://127.0.0.1:9200/veripatch-*/_search' \
              -H 'content-type: application/json' \
              -d "${payload}")
            end_ns=$(date +%s%N)

            echo "--- XERJ ---"
            echo "wall_ms=$(( (end_ns - start_ns) / 1000000 )) engine_took_ms=$(jq -r '.took // "n/a"' <<<"${response}") total_hits=$(jq -r '.hits.total.value // .hits.total // 0' <<<"${response}")"
            jq -r '.hits.hits[] | [
              (._score|tostring),
              (._source.ax_path // "?"),
              (._source.language // "?"),
              ((._source.symbols // []) | map(.name) | join(","))
            ] | @tsv' <<<"${response}"

            echo "--- GREP BASELINE ---"
            pattern=$(sed 's/ /|/g' <<<"${q}")
            start_ns=$(date +%s%N)
            set +e
            grep_out=$(grep -RIlE -i "${pattern}" src tests docs README.md VeriPatch_BLUEPRINT.md 2>/dev/null)
            grep_code=$?
            set -e
            end_ns=$(date +%s%N)

            if [[ "${grep_code}" != "0" && "${grep_code}" != "1" ]]; then
              exit "${grep_code}"
            fi
            grep_count=$(printf '%s\\n' "${grep_out}" | sed '/^$/d' | wc -l | tr -d ' ')
            echo "wall_ms=$(( (end_ns - start_ns) / 1000000 )) matching_files=${grep_count}"
            printf '%s\\n' "${grep_out}" | sed '/^$/d' | head -n 20
          done

      - name: Symbol-definition retrieval check
        shell: bash
        run: |
          set -euo pipefail
          echo "=== TOP DEFINITIONS MATCHING verify ==="
          curl -fsS -XPOST 'http://127.0.0.1:9200/veripatch-*/_search' \
            -H 'content-type: application/json' \
            -d '{
              "query":{"match":{"defs":"verify"}},
              "size":10,
              "_source":["ax_path","language","defs","symbols"],
              "track_total_hits":true
            }' | jq '{
              took,
              total: .hits.total,
              hits: [.hits.hits[] | {
                score: ._score,
                path: ._source.ax_path,
                language: ._source.language,
                symbols: (._source.symbols // [] | map({kind,name,line}))
              }]
            }'

      - name: Server log tail
        if: always()
        shell: bash
        run: |
          echo "=== XERJ SERVER LOG (tail) ==="
          tail -n 80 /tmp/xerj-server.log || true
